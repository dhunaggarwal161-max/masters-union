<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Masters' Union — Creative Studio</title>

  <style>
    :root {
      --black: #111111;
      --white: #f8f7f3;
      --cream: #eeece5;
      --muted: #77746d;
      --line: #d8d5cc;
      --accent: #c9ff00;
      --dark-green: #152319;
      --radius: 2px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--white);
      color: var(--black);
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    /* NAV */

    nav {
      height: 76px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 42px;
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(248,247,243,.94);
      backdrop-filter: blur(12px);
    }

    .logo {
      font-size: 17px;
      font-weight: 900;
      letter-spacing: -0.04em;
    }

    .logo span {
      display: block;
      font-size: 9px;
      letter-spacing: .16em;
      font-weight: 600;
      margin-top: 3px;
    }

    .nav-right {
      display: flex;
      gap: 28px;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
    }

    .nav-right a:hover {
      opacity: .55;
    }

    /* HERO */

    .hero {
      min-height: 650px;
      background: var(--black);
      color: var(--white);
      padding: 85px 5vw 75px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .hero:after {
      content: "";
      position: absolute;
      width: 600px;
      height: 600px;
      right: -260px;
      bottom: -340px;
      border-radius: 50%;
      background: var(--accent);
      opacity: .9;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
      font-weight: 700;
      position: relative;
      z-index: 2;
    }

    .hero h1 {
      max-width: 1000px;
      font-size: clamp(70px, 11vw, 160px);
      line-height: .84;
      letter-spacing: -.075em;
      font-weight: 900;
      position: relative;
      z-index: 2;
    }

    .hero h1 em {
      font-family: Georgia, serif;
      font-weight: 400;
    }

    .hero-bottom {
      display: flex;
      justify-content: space-between;
      align-items: end;
      position: relative;
      z-index: 2;
      gap: 40px;
    }

    .hero-bottom p {
      max-width: 390px;
      font-size: 15px;
      line-height: 1.5;
      color: #bcbcb7;
    }

    .stats {
      display: flex;
      gap: 45px;
    }

    .stat strong {
      display: block;
      font-size: 34px;
      letter-spacing: -.05em;
    }

    .stat span {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: #888884;
    }

    /* SECTIONS */

    section {
      padding: 110px 5vw;
    }

    .section-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .17em;
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 30px;
    }

    .intro {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: start;
    }

    .intro h2 {
      font-size: clamp(42px, 6vw, 84px);
      line-height: .9;
      letter-spacing: -.065em;
    }

    .intro-copy {
      font-size: 18px;
      line-height: 1.55;
      max-width: 520px;
    }

    /* WORK */

    .work-section {
      background: var(--cream);
    }

    .video-wrap {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
      overflow: hidden;
      margin-top: 55px;
    }

    .video-wrap iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* ROLES */

    .roles-section {
      background: var(--white);
    }

    .roles-top {
      display: flex;
      justify-content: space-between;
      align-items: end;
      margin-bottom: 45px;
      gap: 30px;
    }

    .roles-top h2 {
      font-size: clamp(55px, 8vw, 115px);
      letter-spacing: -.075em;
      line-height: .8;
    }

    .search-area {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .search-area input,
    .search-area select {
      height: 42px;
      border: 1px solid var(--line);
      background: transparent;
      padding: 0 13px;
      outline: none;
      font-size: 12px;
    }

    .search-area input {
      width: 210px;
    }

    .roles-count {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 22px;
    }

    .role-list {
      border-top: 1px solid var(--black);
    }

    .role-item {
      border-bottom: 1px solid var(--line);
    }

    .role-main {
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
      cursor: pointer;
      transition: padding .25s ease;
    }

    .role-main:hover {
      padding-left: 15px;
      padding-right: 15px;
    }

    .role-title {
      font-size: clamp(21px, 3vw, 34px);
      letter-spacing: -.045em;
      font-weight: 700;
    }

    .role-arrow {
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: .25s;
      font-size: 17px;
    }

    .role-item.open .role-arrow {
      transform: rotate(45deg);
      background: var(--black);
      color: var(--white);
      border-color: var(--black);
    }

    .role-detail {
      max-height: 0;
      overflow: hidden;
      transition: max-height .45s ease;
    }

    .role-item.open .role-detail {
      max-height: 900px;
    }

    .role-detail-inner {
      padding: 8px 4px 38px;
      max-width: 1050px;
    }

    .tldr {
      font-size: 14px;
      line-height: 1.5;
      max-width: 750px;
      margin-bottom: 28px;
      color: #46443f;
    }

    .detail-meta {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      margin-bottom: 25px;
    }

    .meta-box {
      padding: 17px 12px;
      border-right: 1px solid var(--line);
    }

    .meta-box:last-child {
      border-right: none;
    }

    .meta-label {
      display: block;
      text-transform: uppercase;
      font-size: 8px;
      letter-spacing: .15em;
      color: var(--muted);
      margin-bottom: 7px;
    }

    .meta-value {
      font-size: 13px;
      font-weight: 700;
    }

    /* SMALL BOXED SUBHEADINGS */

    .accordion {
      display: grid;
      gap: 7px;
      margin-bottom: 25px;
    }

    .accordion-box {
      border: 1px solid var(--line);
      background: #f3f1eb;
    }

    .accordion-header {
      padding: 15px 17px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .accordion-header span {
      font-size: 16px;
      font-weight: 400;
    }

    .accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height .3s ease;
    }

    .accordion-box.active .accordion-content {
      max-height: 400px;
    }

    .accordion-content-inner {
      padding: 0 17px 17px;
      color: #55524c;
      font-size: 13px;
      line-height: 1.6;
    }

    .role-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      border: 1px solid var(--black);
      min-height: 45px;
      padding: 0 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .12em;
      font-weight: 800;
      cursor: pointer;
      background: transparent;
    }

    .btn-black {
      background: var(--black);
      color: white;
    }

    .btn-black:hover {
      background: var(--accent);
      color: var(--black);
    }

    /* PERKS */

    .perks {
      background: var(--dark-green);
      color: var(--white);
    }

    .perks-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      margin-top: 55px;
      border-top: 1px solid #465048;
      border-left: 1px solid #465048;
    }

    .perk {
      min-height: 180px;
      padding: 25px;
      border-right: 1px solid #465048;
      border-bottom: 1px solid #465048;
    }

    .perk-number {
      font-size: 11px;
      color: #909b91;
      margin-bottom: 45px;
    }

    .perk h3 {
      font-size: 19px;
      letter-spacing: -.03em;
    }

    /* CTA */

    .cta {
      background: var(--accent);
      min-height: 500px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .cta h2 {
      font-size: clamp(60px, 10vw, 150px);
      line-height: .8;
      letter-spacing: -.08em;
      max-width: 1100px;
    }

    .cta-bottom {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 30px;
    }

    .cta-bottom p {
      max-width: 430px;
      font-size: 15px;
      line-height: 1.5;
    }

    /* ROLE PAGE */

    .role-page {
      min-height: 100vh;
      background: var(--white);
    }

    .role-hero {
      background: var(--black);
      color: white;
      padding: 90px 5vw 80px;
    }

    .back {
      display: inline-block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .15em;
      margin-bottom: 80px;
      color: #aaa;
    }

    .role-hero h1 {
      font-size: clamp(60px, 10vw, 145px);
      line-height: .82;
      letter-spacing: -.075em;
      max-width: 1100px;
    }

    .role-page-body {
      padding: 75px 5vw;
      max-width: 1200px;
      margin: auto;
    }

    .role-page-grid {
      display: grid;
      grid-template-columns: 1.3fr .7fr;
      gap: 100px;
    }

    .role-page-description {
      font-size: 21px;
      line-height: 1.5;
      color: #35332f;
    }

    .role-page-side {
      border-top: 1px solid var(--black);
    }

    .side-row {
      border-bottom: 1px solid var(--line);
      padding: 18px 0;
    }

    .side-row small {
      display: block;
      font-size: 8px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 7px;
    }

    .side-row strong {
      font-size: 13px;
    }

    .apply-section {
      background: var(--cream);
      margin-top: 70px;
      padding: 55px;
    }

    .apply-section h2 {
      font-size: 55px;
      letter-spacing: -.06em;
      margin-bottom: 35px;
    }

    /* FORM */

    .application {
      max-width: 900px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 22px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #c9c6bd;
      background: var(--white);
      min-height: 50px;
      padding: 14px;
      outline: none;
      font-size: 13px;
    }

    textarea {
      min-height: 125px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--black);
    }

    .submit-btn {
      background: var(--black);
      color: white;
      border: 0;
      min-height: 52px;
      padding: 0 30px;
      text-transform: uppercase;
      letter-spacing: .13em;
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
    }

    .submit-btn:hover {
      background: #333;
    }

    .form-note {
      font-size: 10px;
      color: var(--muted);
      margin-top: 15px;
    }

    .success {
      display: none;
      padding: 25px;
      background: var(--accent);
      margin-top: 20px;
      font-weight: 700;
    }

    /* FOOTER */

    footer {
      padding: 35px 5vw;
      background: var(--black);
      color: #aaa;
      display: flex;
      justify-content: space-between;
      font-size: 10px;
    }

    /* MOBILE */

    @media (max-width: 800px) {
      nav {
        padding: 0 20px;
      }

      .nav-right {
        display: none;
      }

      .hero {
        min-height: 620px;
        padding: 60px 25px 50px;
      }

      .hero h1 {
        font-size: 70px;
      }

      .hero-bottom {
        flex-direction: column;
        align-items: start;
      }

      .stats {
        gap: 30px;
      }

      section {
        padding: 75px 25px;
      }

      .intro,
      .role-page-grid {
        grid-template-columns: 1fr;
        gap: 40px;
      }

      .roles-top {
        flex-direction: column;
        align-items: start;
      }

      .search-area {
        width: 100%;
      }

      .search-area input {
        width: 100%;
      }

      .detail-meta {
        grid-template-columns: 1fr;
      }

      .meta-box {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .meta-box:last-child {
        border-bottom: 0;
      }

      .perks-grid {
        grid-template-columns: 1fr 1fr;
      }

      .apply-section {
        padding: 30px 20px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .role-page-body {
        padding: 55px 25px;
      }

      .role-page-grid {
        gap: 55px;
      }

      footer {
        flex-direction: column;
        gap: 10px;
      }
    }
  </style>
</head>

/* =========================================================

========================================================= */

function slugify(str) {
  return str.toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/(^-|-$)/g, "");
}

function goHome() {
  history.pushState({}, "", window.location.pathname);
  renderHome();
  window.scrollTo(0, 0);
}

function goRole(id) {
  history.pushState({}, "", "?role=" + id);
  renderRolePage(id);
  window.scrollTo(0, 0);
}

window.addEventListener("popstate", () => {
  const id = new URLSearchParams(location.search).get("role");

  if (id) {
    renderRolePage(id);
  } else {
    renderHome();
  }
});

/* =========================================================

function renderRoleList(filtered = roles) {

  const list = document.getElementById("roleList");

  if (!filtered.length) {
    list.innerHTML = `
      <div style="padding:50px 0;color:#777;">
        No roles found.
      </div>
    `;

    document.getElementById("rolesCount").textContent = "0 roles";
    return;
  }

  document.getElementById("rolesCount").textContent =
    filtered.length + " open role" + (filtered.length === 1 ? "" : "s");

  list.innerHTML = filtered.map(role => `

    <article class="role-item" id="item-${role.id}">

      <!-- ONLY ROLE NAME ON THE LIST -->
      <div
        class="role-main"
        onclick="toggleRole('${role.id}')"
      >

        <div class="role-title">
          ${role.title}
        </div>

        <div class="role-arrow">
          +
        </div>

      </div>


      <!-- DETAILS OPEN AFTER ONE CLICK -->
      <div class="role-detail">

        <div class="role-detail-inner">

          <p class="tldr">
            ${role.tldr}
          </p>

          <div class="detail-meta">

            <div class="meta-box">
              <span class="meta-label">Team</span>
              <span class="meta-value">${role.team}</span>
            </div>

            <div class="meta-box">
              <span class="meta-label">Type</span>
              <span class="meta-value">${role.type}</span>
            </div>

            <div class="meta-box">
              <span class="meta-label">CTC</span>
              <span class="meta-value">${role.ctc}</span>
            </div>

          </div>


          <div class="accordion">

            ${Object.entries(role.sections).map(([heading, content]) => `

              <div class="accordion-box">

                <div
                  class="accordion-header"
                  onclick="toggleAccordion(event, this)"
                >
                  ${heading}
                  <span>+</span>
                </div>

                <div class="accordion-content">

                  <div class="accordion-content-inner">
                    ${content}
                  </div>

                </div>

              </div>

            `).join("")}

          </div>


          <div class="role-actions">

            <button
              class="btn btn-black"
              onclick="goRole('${role.id}')"
            >
              View Role →
            </button>

          </div>

        </div>

      </div>

    </article>

  `).join("");
}


/* =========================================================
   ROLE EXPANSION
========================================================= */

function toggleRole(id) {

  const item = document.getElementById("item-" + id);

  if (!item) return;

  const isOpen = item.classList.contains("open");

  document.querySelectorAll(".role-item.open")
    .forEach(el => el.classList.remove("open"));

  if (!isOpen) {
    item.classList.add("open");
  }
}


/* =========================================================
   SMALL BOX ACCORDIONS
========================================================= */

function toggleAccordion(event, element) {

  event.stopPropagation();

  const box = element.parentElement;
  const wasActive = box.classList.contains("active");

  box.parentElement
    .querySelectorAll(".accordion-box")
    .forEach(item => item.classList.remove("active"));

  if (!wasActive) {
    box.classList.add("active");
  }
}


/* =========================================================
   SEARCH
========================================================= */

function filterRoles() {

  const search =
    document.getElementById("searchInput").value.toLowerCase();

  const team =
    document.getElementById("teamFilter").value;

  const type =
    document.getElementById("typeFilter").value;

  const filtered = roles.filter(role => {

    const matchesSearch =
      role.title.toLowerCase().includes(search) ||
      role.team.toLowerCase().includes(search);

    const matchesTeam =
      !team || role.team === team;

    const matchesType =
      !type || role.type === type;

    return matchesSearch && matchesTeam && matchesType;

  });

  renderRoleList(filtered);
}

/* =========================================================

function submitApplication(event) {

    This currently shows the success state locally.

    form to Formspree / Google Forms / your backend.

  event.target.reset();

    top: document.body.scrollHeight,
    behavior: "smooth"
  });
}
